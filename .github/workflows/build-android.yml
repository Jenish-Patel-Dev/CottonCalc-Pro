name: Build Android App (.aab & .apk)

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Production (.aab) & Test (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node dependencies
        run: npm install

      - name: 🏗️ Build Web Assets
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: 📱 Build Test APK (.apk)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Build Play Store App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: 📤 Upload Installable Test APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: CottonCalc-Pro-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 📤 Upload Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: CottonCalc-Pro-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
